      align-items: center;
      justify-content: center;
    }

      max-width: 800px;
      aspect-ratio: 16 / 9;
      border: 3px solid #000;
      box-shadow: 0 0 0 2px #334155;
      transition: all 0.2s ease;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;

function drawSprite(spriteObj, x, y, w, h, flipX = false) {
  const { palette, grid } = spriteObj;
  const rows = grid.length;
  const cols = grid[0].length;
  const pw = w / cols;
  const ph = h / rows;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const ch = grid[r][c];
      if (ch === '.') continue;
      ctx.fillStyle = palette[ch];
      const drawCol = flipX ? (cols - 1 - c) : c;
      ctx.fillRect(
        Math.floor(x + drawCol * pw),
        Math.floor(y + r * ph),
        Math.ceil(pw),
        Math.ceil(ph)
      );
    }
  }
}

function getSavedProgress() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function saveProgress(lvl, sc, cn) {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ level: lvl, score: sc, coins: cn }));
  } catch (e) {}
}

function clearProgress() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}

function refreshMenu() {
  const saved = getSavedProgress();
  if (saved && saved.level > 1 && saved.level <= MAX_LEVELS) {
    btnContinue.style.display = 'block';
    btnContinue.textContent = `DEVAM ET (BÖLÜM ${saved.level})`;
  } else {
    btnContinue.style.display = 'none';
  }
}

  coinCount = startCoins;
  allCompleted = false;

}

function returnToMenu() {
  isGameRunning = false;
  keys.left = false;
  keys.right = false;
  gameStage.style.display = 'none';
  mainMenu.style.display = 'flex';
  refreshMenu();
}

});

      { x: 2600, y: 400, w: 600, h: 50, type: 'ground' }
    ],
    coins: [
      { x: 575, y: 250 }, { x: 720, y: 290 }, { x: 1010, y: 220 },
      { x: 1300, y: 150 }, { x: 1810, y: 210 }, { x: 2220, y: 240 },
      { x: 2375, y: 290 }, { x: 2520, y: 240 }, { x: 2800, y: 350 }
    ],
    enemies: [
      { type: 'bot', x: 380, y: 368, w: 32, h: 32, vx: -1.5, minX: 200, maxX: 480 },
      { type: 'drone', x: 1050, y: 180, baseY: 180, w: 36, h: 26, vx: -1.8, minX: 850, maxX: 1380, phase: 0 },
      { type: 'mine', x: 1850, y: 368, w: 36, h: 32, vx: -1.8, minX: 1550, maxX: 2100 },
      { type: 'plasma', x: 2000, y: 368, w: 32, h: 32, vx: -1.6, vy: 0, minX: 1600, maxX: 2120 },
      { type: 'drone', x: 2450, y: 220, baseY: 220, w: 36, h: 26, vx: -1.9, minX: 2280, maxX: 2650, phase: 2 }
    ]
  }
];

let platforms = [];
let coins = [];
let enemies = [];
let portal = { x: 2250, y: 290, width: 44, height: 110 };
let currentTheme = LEVELS[0];

function loadLevel(lvlNum) {
  currentLevel = lvlNum;
  currentTheme = LEVELS[lvlNum - 1];
  player.x = 60; player.y = 200; player.vx = 0; player.vy = 0;
  player.grounded = false; player.jumpCount = 0; player.facing = 1;
  cameraX = 0;
  gameOver = false;
  levelCleared = false;
  jumpEffects = [];

  platforms = currentTheme.platforms.map(p => ({ ...p }));
  coins = currentTheme.coins.map(c => ({ x: c.x, y: c.y, r: 11, collected: false }));
  enemies = currentTheme.enemies.map(e => ({ ...e, alive: true }));
  portal.x = currentTheme.flagX;

  updateHUD();
}

function updateHUD() {
  levelEl.textContent = `${currentLevel}/${MAX_LEVELS}`;
  scoreEl.textContent = score;
  coinsEl.textContent = coinCount;
}

function triggerJump() {
  if (!isGameRunning || gameOver || levelCleared || allCompleted) return;
  if (player.grounded || player.jumpCount < player.maxJumps) {
    player.vy = player.jumpPower;
    player.grounded = false;
    player.jumpCount++;
    if (player.jumpCount === 2) {
      jumpEffects.push({ x: player.x + player.width / 2, y: player.y + player.height, size: 12, alpha: 1 });
    }
  }
}

function checkCollision(a, b) {
  return a.x < b.x + b.w && a.x + a.width > b.x &&
         a.y < b.y + b.h && a.y + a.height > b.y;
}

function update(dt) {
  if (!isGameRunning || gameOver || levelCleared || allCompleted) return;

  animTick += dt;

  if (keys.right) {
    player.vx = player.speed;
    player.facing = 1;
  } else if (keys.left) {
    player.vx = -player.speed;
    player.facing = -1;
  } else {
    player.vx *= Math.pow(FRICTION, dt);
  }

  player.vy += GRAVITY * dt;
  player.x += player.vx * dt;
  if (player.x < 0) player.x = 0;

  platforms.forEach(p => {
    if (checkCollision(player, p)) {
      if (player.vx > 0) player.x = p.x - player.width;
      else if (player.vx < 0) player.x = p.x + p.w;
    }
  });

  const prevBottom = player.y + player.height;
  player.y += player.vy * dt;
  player.grounded = false;

  platforms.forEach(p => {
    if (checkCollision(player, p)) {
      if (player.vy > 0) {
        player.y = p.y - player.height;
        player.vy = 0;
        player.grounded = true;
        player.jumpCount = 0;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  });

  jumpEffects.forEach(ef => { ef.size += 1.6 * dt; ef.alpha -= 0.06 * dt; });
  jumpEffects = jumpEffects.filter(ef => ef.alpha > 0);

  if (player.y > canvas.height) gameOver = true;

  // Enerji Kristali Toplama
  coins.forEach(c => {
    if (!c.collected) {
      let box = { x: c.x - c.r, y: c.y - c.r, w: c.r * 2, h: c.r * 2 };
      if (checkCollision(player, box)) {
        c.collected = true;
        coinCount++;
        score += 100;
        updateHUD();
      }
    }
  });

  // Düşman Hareketleri
  enemies.forEach(e => {
    if (!e.alive) return;

    if (e.type === 'bot' || e.type === 'mine') {
      e.x += e.vx * dt;
      if (e.x <= e.minX || e.x + e.w >= e.maxX) e.vx *= -1;
    } else if (e.type === 'plasma') {
      e.x += e.vx * dt;
      if (e.x <= e.minX || e.x + e.w >= e.maxX) e.vx *= -1;
      e.vy += 0.4 * dt;
      e.y += e.vy * dt;
      if (e.y >= 368) {
        e.y = 368;
        e.vy = -8.5;
      }
    } else if (e.type === 'drone') {
      e.x += e.vx * dt;
      if (e.x <= e.minX || e.x + e.w >= e.maxX) e.vx *= -1;
      e.phase += 0.06 * dt;
      e.y = e.baseY + Math.sin(e.phase) * 35;
    }

    if (checkCollision(player, e)) {
      if (e.type === 'mine') {
        gameOver = true;
      } else if (player.vy > 0 && prevBottom <= e.y + 16) {
        e.alive = false;
        player.vy = -8;
        player.jumpCount = 1;
        score += 250;
        updateHUD();
      } else {
        gameOver = true;
      }
    }
  });

  // Işınlanma Portalı Kontrolü
  if (checkCollision(player, { x: portal.x, y: portal.y, w: portal.width, h: portal.height })) {
    score += 1000;
    updateHUD();
    if (currentLevel < MAX_LEVELS) {
      levelCleared = true;
      saveProgress(currentLevel + 1, score, coinCount);
    } else {
      allCompleted = true;
      clearProgress();
    }
  }

  if (player.x > canvas.width * 0.4) {
    cameraX = player.x - canvas.width * 0.4;
  }
}

// ÖZGÜN RETRO SİBER-PİKSEL ÇİZİM FONKSİYONLARI
function draw() {
  if (!isGameRunning) return;

  ctx.fillStyle = currentTheme.sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Uzak Arka Plan Yıldızları ve Piksel Dağ Silüetleri (Paralaks)
  ctx.fillStyle = currentTheme.starColor;
  for (let i = 0; i < 35; i++) {
    const sx = ((i * 197) - Math.floor(cameraX * 0.2)) % 900;
    const drawX = sx < 0 ? sx + 900 : sx;
    const sy = (i * 73) % 240 + 20;
    ctx.fillRect(drawX, sy, 4, 4);
  }

  ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
  for (let m = 0; m < 8; m++) {
    const mx = m * 240 - Math.floor(cameraX * 0.35);
    ctx.fillRect(mx + 40, 290, 120, 110);
    ctx.fillRect(mx + 65, 250, 70, 40);
    ctx.fillRect(mx + 85, 220, 30, 30);
  }

  ctx.save();
  ctx.translate(-Math.floor(cameraX), 0);

  // Platformlar, Metal Bloklar ve Enerji Sütunları
  platforms.forEach(p => {
    if (p.type === 'ground') {
      ctx.fillStyle = currentTheme.groundBody;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      // Metalik / Kaya Izgara Deseni
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      for (let gx = p.x + 8; gx < p.x + p.w - 8; gx += 32) {
        ctx.fillRect(gx, p.y + 16, 16, 10);
        ctx.fillRect(gx + 8, p.y + 30, 16, 10);
      }
      // Üst Neon / Toprak Şeridi
      ctx.fillStyle = currentTheme.groundTop;
      ctx.fillRect(p.x, p.y, p.w, 10);
      ctx.fillStyle = '#000';
      ctx.fillRect(p.x, p.y + 10, p.w, 2);
    } else if (p.type === 'metal') {
      // Çelik Perçinli Platform
      ctx.fillStyle = '#475569';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(p.x, p.y, p.w, 4);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(p.x, p.y + p.h - 4, p.w, 4);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x, p.y, p.w, p.h);
      // Perçin noktaları
      ctx.fillStyle = '#cbd5e1';
      for (let rx = p.x + 8; rx < p.x + p.w - 6; rx += 22) {
        ctx.fillRect(rx, p.y + 9, 4, 4);
      }
    } else if (p.type === 'pillar') {
      // Parlayan Enerji Sütunu
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#06b6d4';
      ctx.fillRect(p.x + 8, p.y + 8, p.w - 16, p.h - 8);
      ctx.fillStyle = '#a5f3fc';
      ctx.fillRect(p.x + 14, p.y + 8, 6, p.h - 8);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x, p.y, p.w, p.h);
    }
  });

  // Enerji Kristalleri
  coins.forEach(c => {
    if (!c.collected) {
      const bob = Math.sin(animTick * 0.1 + c.x) * 3;
      drawSprite(SPRITES.crystal, c.x - 10, c.y - 10 + bob, 20, 20);
    }
  });

  // Düşmanlar
  enemies.forEach(e => {
    if (!e.alive) return;
    const flip = e.vx > 0;
    if (e.type === 'bot') {
      drawSprite(SPRITES.bot, e.x, e.y, e.w, e.h, flip);
    } else if (e.type === 'plasma') {
      drawSprite(SPRITES.plasma, e.x, e.y, e.w, e.h, Math.floor(animTick / 8) % 2 === 0);
    } else if (e.type === 'drone') {
      drawSprite(SPRITES.drone, e.x, e.y, e.w, e.h, flip);
    } else if (e.type === 'mine') {
      drawSprite(SPRITES.mine, e.x, e.y, e.w, e.h, flip);
    }
  });

  // Çift Zıplama Enerji Dalgası
  jumpEffects.forEach(ef => {
    ctx.fillStyle = `rgba(56, 189, 248, ${ef.alpha})`;
    ctx.fillRect(ef.x - ef.size, ef.y - 4, 10, 6);
    ctx.fillRect(ef.x + ef.size - 10, ef.y - 4, 10, 6);
    ctx.fillRect(ef.x - 5, ef.y + 2, 10, 5);
  });

  // Bitiş Işınlanma Portalı (Warp Gate)
  ctx.fillStyle = '#334155';
  ctx.fillRect(portal.x, portal.y, 8, portal.height);
  ctx.fillRect(portal.x + portal.width - 8, portal.y, 8, portal.height);
  ctx.fillRect(portal.x, portal.y, portal.width, 10);
  // İç enerji alanı
  const pulse = Math.floor(animTick / 6) % 2 === 0;
  ctx.fillStyle = pulse ? '#38bdf8' : '#818cf8';
  ctx.fillRect(portal.x + 8, portal.y + 10, portal.width - 16, portal.height - 10);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(portal.x + 16, portal.y + 16, 6, portal.height - 22);

  // Siber Şövalye (Oyuncu)
  const isMoving = Math.abs(player.vx) > 0.4 && player.grounded;
  const activeHero = (isMoving && Math.floor(animTick / 6) % 2 === 1)
    ? SPRITES.heroWalk
    : SPRITES.heroIdle;
  drawSprite(activeHero, player.x, player.y, player.width, player.height, player.facing === -1);

  ctx.restore();

  // Durum Ekranları
  if (gameOver || levelCleared || allCompleted) {
    ctx.fillStyle = 'rgba(9, 13, 22, 0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#38bdf8';
    ctx.textAlign = 'center';

    if (allCompleted) {
      ctx.font = 'bold 30px "Courier New", monospace';
      ctx.fillText('TUM 5 BOLUM TAMAMLANDI!', canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillText(`SKOR: ${score} - ANA MENU ICIN DOKUN`, canvas.width / 2, canvas.height / 2 + 25);
    } else if (levelCleared) {
      ctx.font = 'bold 30px "Courier New", monospace';
      ctx.fillText(`BOLUM ${currentLevel} GECILDI!`, canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillText(`BOLUM ${currentLevel + 1} ICIN EKRANA DOKUN`, canvas.width / 2, canvas.height / 2 + 25);
    } else {
      ctx.fillStyle = '#ef4444';
      ctx.font = 'bold 34px "Courier New", monospace';
      ctx.fillText('OYUN BITTI!', canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillText('TEKRAR DENEMEK ICIN DOKUN', canvas.width / 2, canvas.height / 2 + 25);
    }
  }
}

let lastTime = performance.now();

function loop(now) {
  let rawDt = (now - lastTime) / (1000 / 60);
  lastTime = now;
  if (rawDt > 2.5) rawDt = 2.5;

  update(rawDt);
  draw();
  requestAnimationFrame(loop);
}

function handleScreenAction() {
  if (!isGameRunning) return;
  if (allCompleted) returnToMenu();
  else if (levelCleared) loadLevel(currentLevel + 1);
  else if (gameOver) loadLevel(currentLevel);
}

window.addEventListener('keydown', e => {
  if (!isGameRunning) return;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if ((e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') && !e.repeat) {
    if (gameOver || levelCleared || allCompleted) handleScreenAction();
    else triggerJump();
  }
  if (e.code === 'KeyR' && gameOver) loadLevel(currentLevel);
});

window.addEventListener('keyup', e => {
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
});

const bindMove = (id, key) => {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; }, { passive: false });
  btn.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; }, { passive: false });
  btn.addEventListener('touchcancel', e => { e.preventDefault(); keys[key] = false; }, { passive: false });
};
bindMove('btn-left', 'left');
bindMove('btn-right', 'right');

const jumpBtn = document.getElementById('btn-jump');
jumpBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  if (gameOver || levelCleared || allCompleted) handleScreenAction();
  else triggerJump();
}, { passive: false });

canvas.addEventListener('click', handleScreenAction);

refreshMenu();
requestAnimationFrame(loop);
</script>
