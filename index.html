<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>2D Platform</title>
  <link rel="manifest" href="/2d_game/manifest.json">
  <link rel="icon" type="image/png" href="/2d_game/icon.png">
  <link rel="apple-touch-icon" href="/2d_game/icon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%;
      height: 100dvh;
      background-color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* ANA MENÜ */
    #main-menu {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 65%, #16a34a 65%, #15803d 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      text-align: center;
    }
    .game-title {
      font-size: clamp(34px, 6.5vw, 58px);
      font-weight: 900;
      color: #ffffff;
      text-shadow: 4px 4px 0 #1e293b, -1px -1px 0 #1e293b;
      margin-bottom: 32px;
      letter-spacing: 2px;
    }
    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 290px;
    }
    .menu-btn {
      padding: 15px 20px;
      font-size: 18px;
      font-weight: bold;
      border: 3px solid #ffffff;
      border-radius: 14px;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(15, 23, 42, 0.5);
      transition: transform 0.1s;
    }
    .menu-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(15, 23, 42, 0.5);
    }
    #btn-continue {
      background: #22c55e;
      display: none;
    }
    #btn-new-game {
      background: #ef4444;
    }

    /* OYUN SAHNESİ (Varsayılan / Masaüstü Düzeni) */
    #game-stage {
      display: none;
      position: fixed;
      inset: 0;
      background: #0f172a;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transition: all 0.25s ease;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      font-size: 16px;
      font-weight: bold;
      text-shadow: 2px 2px 0 #000;
      z-index: 5;
      pointer-events: none;
    }
    #btn-in-game-menu {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.55);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      color: white;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    /* MOBİL KONTROLLER */
    #mobile-controls {
      display: none;
      width: 100%;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }
    .btn-group {
      display: flex;
      gap: 22px;
      pointer-events: auto;
    }
    .ctrl-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      border: 2px solid rgba(255, 255, 255, 0.4);
      color: rgba(255, 255, 255, 0.9);
      font-size: 28px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      pointer-events: auto;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
    }
    .ctrl-btn:active {
      background: rgba(255, 255, 255, 0.4);
      border-color: rgba(255, 255, 255, 0.8);
      transform: scale(0.94);
    }

    /* 1) MOBİL DİK MOD (PORTRAIT): Oyun üstte kompakt 16:9 açılır, tuşlar altında durur */
    @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
      #game-stage {
        justify-content: space-between;
        padding-top: max(16px, env(safe-area-inset-top));
        padding-bottom: max(28px, env(safe-area-inset-bottom));
      }
      #game-container {
        width: 100vw;
        max-width: 100vw;
        aspect-ratio: 16 / 9;
        margin-top: auto;
        margin-bottom: auto;
      }
      #mobile-controls {
        display: flex;
        padding: 0 24px;
        margin-bottom: 12px;
      }
      .ctrl-btn {
        background: rgba(255, 255, 255, 0.12);
      }
    }

    /* 2) MOBİL YATAY MOD (LANDSCAPE): Oyun tam ekrana büyür, tuşlar ekranın köşelerine geçer */
    @media (hover: none) and (pointer: coarse) and (orientation: landscape) {
      #game-container {
        width: 100vw;
        height: 100dvh;
        max-width: 100vw;
        max-height: 100dvh;
        aspect-ratio: auto;
      }
      #mobile-controls {
        display: flex;
        position: fixed;
        bottom: max(18px, env(safe-area-inset-bottom));
        left: max(24px, env(safe-area-inset-left));
        right: max(24px, env(safe-area-inset-right));
        width: auto;
      }
    }
  </style>
</head>

let jumpEffects = [];

function getSavedProgress() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function saveProgress(lvl, sc, cn) {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ level: lvl, score: sc, coins: cn }));
  } catch (e) {}
}

function clearProgress() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}

function refreshMenu() {
  const saved = getSavedProgress();
  if (saved && saved.level > 1 && saved.level <= MAX_LEVELS) {
    btnContinue.style.display = 'block';
    btnContinue.textContent = `DEVAM ET (BÖLÜM ${saved.level})`;
  } else {
    btnContinue.style.display = 'none';
  }
}

function startGame(startLevel, startScore, startCoins) {
  isGameRunning = true;
  mainMenu.style.display = 'none';
  gameStage.style.display = 'flex';

  score = startScore;
  coinCount = startCoins;
  allCompleted = false;
  loadLevel(startLevel);
}

function returnToMenu() {
  isGameRunning = false;
  keys.left = false;
  keys.right = false;
  gameStage.style.display = 'none';
  mainMenu.style.display = 'flex';
  refreshMenu();
}

btnNewGame.addEventListener('click', () => {
  clearProgress();
  startGame(1, 0, 0);
});

btnContinue.addEventListener('click', () => {
  const saved = getSavedProgress();
  if (saved) startGame(saved.level, saved.score || 0, saved.coins || 0);
  else startGame(1, 0, 0);
});

btnInGameMenu.addEventListener('click', returnToMenu);

let platforms = [];
let coins = [];
let enemies = [];
let flag = { x: 2250, y: 150, width: 15, height: 250 };
let currentTheme = LEVELS[0];

function loadLevel(lvlNum) {
  currentLevel = lvlNum;
  currentTheme = LEVELS[lvlNum - 1];
  player.x = 60; player.y = 200; player.vx = 0; player.vy = 0;
  player.grounded = false; player.jumpCount = 0;
  cameraX = 0;
  gameOver = false;
  levelCleared = false;
  jumpEffects = [];

  platforms = currentTheme.platforms.map(p => ({ ...p }));
  coins = currentTheme.coins.map(c => ({ x: c.x, y: c.y, r: 10, collected: false }));
  enemies = currentTheme.enemies.map(e => ({ ...e, alive: true }));
  flag.x = currentTheme.flagX;

  updateHUD();
}

function updateHUD() {
  levelEl.textContent = `${currentLevel} / ${MAX_LEVELS}`;
  scoreEl.textContent = score;
  coinsEl.textContent = coinCount;
}

function triggerJump() {
  if (!isGameRunning || gameOver || levelCleared || allCompleted) return;
  if (player.grounded || player.jumpCount < player.maxJumps) {
    player.vy = player.jumpPower;
    player.grounded = false;
    player.jumpCount++;
    if (player.jumpCount === 2) {
      jumpEffects.push({ x: player.x + player.width / 2, y: player.y + player.height, r: 6, alpha: 1 });
    }
  }
}

function checkCollision(a, b) {
  return a.x < b.x + b.w && a.x + a.width > b.x &&
         a.y < b.y + b.h && a.y + a.height > b.y;
}

function update(dt) {
  if (!isGameRunning || gameOver || levelCleared || allCompleted) return;

  if (keys.right) player.vx = player.speed;
  else if (keys.left) player.vx = -player.speed;
  else player.vx *= Math.pow(FRICTION, dt);

  player.vy += GRAVITY * dt;
  player.x += player.vx * dt;
  if (player.x < 0) player.x = 0;

  platforms.forEach(p => {
    if (checkCollision(player, p)) {
      if (player.vx > 0) player.x = p.x - player.width;
      else if (player.vx < 0) player.x = p.x + p.w;
    }
  });

  const prevBottom = player.y + player.height;
  player.y += player.vy * dt;
  player.grounded = false;

  platforms.forEach(p => {
    if (checkCollision(player, p)) {
      if (player.vy > 0) {
        player.y = p.y - player.height;
        player.vy = 0;
        player.grounded = true;
        player.jumpCount = 0;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  });

  jumpEffects.forEach(ef => { ef.r += 1.5 * dt; ef.alpha -= 0.06 * dt; });
  jumpEffects = jumpEffects.filter(ef => ef.alpha > 0);

  if (player.y > canvas.height) gameOver = true;

  coins.forEach(c => {
    if (!c.collected) {
      let box = { x: c.x - c.r, y: c.y - c.r, w: c.r * 2, h: c.r * 2 };
      if (checkCollision(player, box)) {
        c.collected = true;
        coinCount++;
        score += 100;
        updateHUD();
      }
    }
  });

  enemies.forEach(e => {
    if (!e.alive) return;

    if (e.type === 'goomba' || e.type === 'spiky') {
      e.x += e.vx * dt;
      if (e.x <= e.minX || e.x + e.w >= e.maxX) e.vx *= -1;
    } else if (e.type === 'jumper') {
      e.x += e.vx * dt;
      if (e.x <= e.minX || e.x + e.w >= e.maxX) e.vx *= -1;
      e.vy += 0.4 * dt;
      e.y += e.vy * dt;
      if (e.y >= 368) {
        e.y = 368;
        e.vy = -8.5;
      }
    } else if (e.type === 'flyer') {
      e.x += e.vx * dt;
      if (e.x <= e.minX || e.x + e.w >= e.maxX) e.vx *= -1;
      e.phase += 0.06 * dt;
      e.y = e.baseY + Math.sin(e.phase) * 35;
    }

    if (checkCollision(player, e)) {
      if (e.type === 'spiky') {
        gameOver = true;
      } else if (player.vy > 0 && prevBottom <= e.y + 16) {
        e.alive = false;
        player.vy = -8;
        player.jumpCount = 1;
        score += 250;
        updateHUD();
      } else {
        gameOver = true;
      }
    }
  });

  if (checkCollision(player, { x: flag.x, y: flag.y, w: flag.width, h: flag.height })) {
    score += 1000;
    updateHUD();
    if (currentLevel < MAX_LEVELS) {
      levelCleared = true;
      saveProgress(currentLevel + 1, score, coinCount);
    } else {
      allCompleted = true;
      clearProgress();
    }
  }

  if (player.x > canvas.width * 0.4) {
    cameraX = player.x - canvas.width * 0.4;
  }
}

function draw() {
  if (!isGameRunning) return;

  ctx.fillStyle = currentTheme.sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(-cameraX, 0);

  ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
  [150, 600, 1100, 1650, 2200, 2750].forEach(cx => {
    ctx.beginPath();
    ctx.arc(cx, 80, 25, 0, Math.PI * 2);
    ctx.arc(cx + 25, 75, 30, 0, Math.PI * 2);
    ctx.arc(cx + 50, 80, 25, 0, Math.PI * 2);
    ctx.fill();
  });

  platforms.forEach(p => {
    if (p.type === 'ground') {
      ctx.fillStyle = currentTheme.groundBody;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = currentTheme.groundTop;
      ctx.fillRect(p.x, p.y, p.w, 10);
    } else if (p.type === 'brick') {
      ctx.fillStyle = '#b84818';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.strokeStyle = '#000';
      ctx.strokeRect(p.x, p.y, p.w, p.h);
    } else if (p.type === 'pipe') {
      ctx.fillStyle = '#16a34a';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.strokeStyle = '#052e16';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x, p.y, p.w, p.h);
    }
  });

  coins.forEach(c => {
    if (!c.collected) {
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#b8860b';
      ctx.stroke();
    }
  });

  enemies.forEach(e => {
    if (!e.alive) return;
    if (e.type === 'goomba') {
      ctx.fillStyle = '#8b4513';
      ctx.fillRect(e.x, e.y, e.w, e.h);
      ctx.fillStyle = '#fff';
      ctx.fillRect(e.x + 6, e.y + 8, 6, 6);
      ctx.fillRect(e.x + 20, e.y + 8, 6, 6);
    } else if (e.type === 'jumper') {
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(e.x, e.y, e.w, e.h);
      ctx.fillStyle = '#000';
      ctx.fillRect(e.x + 6, e.y + 6, 6, 6);
      ctx.fillRect(e.x + 20, e.y + 6, 6, 6);
    } else if (e.type === 'flyer') {
      ctx.fillStyle = '#9333ea';
      ctx.fillRect(e.x, e.y, e.w, e.h);
      ctx.fillStyle = '#e9d5ff';
      ctx.fillRect(e.x - 6, e.y + 4, 8, 10);
      ctx.fillRect(e.x + e.w - 2, e.y + 4, 8, 10);
      ctx.fillStyle = '#facc15';
      ctx.fillRect(e.x + 8, e.y + 8, 5, 5);
      ctx.fillRect(e.x + 21, e.y + 8, 5, 5);
    } else if (e.type === 'spiky') {
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(e.x, e.y + 6, e.w, e.h - 6);
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(e.x + 3 + i * 10, e.y + 6);
        ctx.lineTo(e.x + 8 + i * 10, e.y - 4);
        ctx.lineTo(e.x + 13 + i * 10, e.y + 6);
        ctx.fill();
      }
    }
  });

  jumpEffects.forEach(ef => {
    ctx.strokeStyle = `rgba(255, 255, 255, ${ef.alpha})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(ef.x, ef.y, ef.r * 1.8, ef.r * 0.5, 0, 0, Math.PI * 2);
    ctx.stroke();
  });

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(flag.x, flag.y, 6, flag.height);
  ctx.fillStyle = '#e52521';
  ctx.beginPath();
  ctx.moveTo(flag.x + 6, flag.y);
  ctx.lineTo(flag.x + 65, flag.y + 25);
  ctx.lineTo(flag.x + 6, flag.y + 50);
  ctx.fill();

  ctx.fillStyle = '#e52521';
  ctx.fillRect(player.x, player.y, player.width, player.height);
  ctx.fillStyle = '#0058f8';
  ctx.fillRect(player.x + 4, player.y + 20, player.width - 8, 22);
  ctx.fillStyle = '#ffcc99';
  ctx.fillRect(player.x + 8, player.y + 6, 18, 12);

  ctx.restore();

  if (gameOver || levelCleared || allCompleted) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';

    if (allCompleted) {
      ctx.font = 'bold 34px sans-serif';
      ctx.fillText('EFSANE! TÜM 5 BÖLÜMÜ BİTİRDİN!', canvas.width / 2, canvas.height / 2 - 20);
      ctx.font = '20px sans-serif';
      ctx.fillText(`Toplam Skor: ${score} — Ana menüye dönmek için dokun`, canvas.width / 2, canvas.height / 2 + 25);
    } else if (levelCleared) {
      ctx.font = 'bold 34px sans-serif';
      ctx.fillText(`BÖLÜM ${currentLevel} TAMAMLANDI!`, canvas.width / 2, canvas.height / 2 - 20);
      ctx.font = '20px sans-serif';
      ctx.fillText(`Bölüm ${currentLevel + 1}'e geçmek için ekrana dokun`, canvas.width / 2, canvas.height / 2 + 25);
    } else {
      ctx.font = 'bold 36px sans-serif';
      ctx.fillText('OYUN BİTTİ!', canvas.width / 2, canvas.height / 2 - 20);
      ctx.font = '20px sans-serif';
      ctx.fillText('Tekrar denemek için ekrana dokun', canvas.width / 2, canvas.height / 2 + 25);
    }
  }
}

let lastTime = performance.now();

function loop(now) {
  let rawDt = (now - lastTime) / (1000 / 60);
  lastTime = now;
  if (rawDt > 2.5) rawDt = 2.5;

  update(rawDt);
  draw();
  requestAnimationFrame(loop);
}

function handleScreenAction() {
  if (!isGameRunning) return;
  if (allCompleted) returnToMenu();
  else if (levelCleared) loadLevel(currentLevel + 1);
  else if (gameOver) loadLevel(currentLevel);
}

window.addEventListener('keydown', e => {
  if (!isGameRunning) return;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if ((e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') && !e.repeat) {
    if (gameOver || levelCleared || allCompleted) handleScreenAction();
    else triggerJump();
  }
  if (e.code === 'KeyR' && gameOver) loadLevel(currentLevel);
});

window.addEventListener('keyup', e => {
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
});

const bindMove = (id, key) => {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; }, { passive: false });
  btn.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; }, { passive: false });
  btn.addEventListener('touchcancel', e => { e.preventDefault(); keys[key] = false; }, { passive: false });
};
bindMove('btn-left', 'left');
bindMove('btn-right', 'right');

const jumpBtn = document.getElementById('btn-jump');
jumpBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  if (gameOver || levelCleared || allCompleted) handleScreenAction();
  else triggerJump();
}, { passive: false });

canvas.addEventListener('click', handleScreenAction);

refreshMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
