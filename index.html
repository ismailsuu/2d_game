<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5c94fc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Süper JS Mario</title>
  <link rel="manifest" href="/2d_game/manifest.json">
  <link rel="icon" type="image/png" href="/2d_game/icon.png">
  <link rel="apple-touch-icon" href="/2d_game/icon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%;
      height: 100dvh;
      background-color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 800px;
      max-height: 450px;
      aspect-ratio: 16 / 9;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    canvas {
      width: 100%;
      height: 100%;
      background: #5c94fc;
      display: block;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      color: white;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
      z-index: 5;
    }
    /* Mobil Kontroller: Ekran içi köşe sabitlemesi */
    #mobile-controls {
      display: none;
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: max(20px, env(safe-area-inset-left));
      right: max(20px, env(safe-area-inset-right));
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 20;
    }
    .btn-group {
      display: flex;
      gap: 16px;
      pointer-events: auto;
    }
    .ctrl-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.75);
      color: white;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      pointer-events: auto;
      backdrop-filter: blur(2px);
    }
    .ctrl-btn:active {
      background: rgba(255, 255, 255, 0.55);
      transform: scale(0.95);
    }
    @media (hover: none) and (pointer: coarse) {
      #mobile-controls { display: flex; }
      #game-container {
        max-width: 100vw;
        max-height: 100dvh;
      }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="hud">
      <span>SKOR: <span id="score">0</span></span>
      <span>ALTIN: <span id="coins">0</span></span>
    </div>
    <canvas id="gameCanvas" width="800" height="450"></canvas>
  </div>

  <div id="mobile-controls">
    <div class="btn-group">
      <button class="ctrl-btn" id="btn-left">◀</button>
      <button class="ctrl-btn" id="btn-right">▶</button>
    </div>
    <button class="ctrl-btn" id="btn-jump">▲</button>
  </div>

<script>
// Service Worker Kaydı (/2d_game/ kapsamı)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/2d_game/sw.js', { scope: '/2d_game/' })
      .then(reg => reg.update())
      .catch(err => console.log('SW hatası:', err));
  });
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const coinsEl = document.getElementById('coins');

// Dengeli Fizik Sabitleri (60 Hz referanslı)
const GRAVITY = 0.45;
const FRICTION = 0.80;
let score = 0;
let coinCount = 0;
let cameraX = 0;
let gameOver = false;
let gameWon = false;

const keys = { right: false, left: false, up: false };

const player = {
  x: 60, y: 200, width: 32, height: 42,
  vx: 0, vy: 0, speed: 3.8, jumpPower: -11,
  grounded: false
};

let platforms = [];
let coins = [];
let enemies = [];
let flag = { x: 2300, y: 150, width: 15, height: 250 };

function initLevel() {
  player.x = 60; player.y = 200; player.vx = 0; player.vy = 0;
  cameraX = 0; score = 0; coinCount = 0; gameOver = false; gameWon = false;
  updateHUD();

  platforms = [
    { x: 0, y: 400, w: 700, h: 50, type: 'ground' },
    { x: 800, y: 400, w: 650, h: 50, type: 'ground' },
    { x: 1550, y: 400, w: 950, h: 50, type: 'ground' },
    { x: 250, y: 280, w: 120, h: 25, type: 'brick' },
    { x: 520, y: 220, w: 90, h: 25, type: 'brick' },
    { x: 950, y: 270, w: 140, h: 25, type: 'brick' },
    { x: 1220, y: 200, w: 100, h: 25, type: 'brick' },
    { x: 1750, y: 280, w: 150, h: 25, type: 'brick' },
    { x: 430, y: 340, w: 45, h: 60, type: 'pipe' },
    { x: 1120, y: 320, w: 45, h: 80, type: 'pipe' },
    { x: 1980, y: 330, w: 45, h: 70, type: 'pipe' }
  ];

  coins = [
    { x: 270, y: 240, r: 10, collected: false },
    { x: 310, y: 240, r: 10, collected: false },
    { x: 350, y: 240, r: 10, collected: false },
    { x: 565, y: 180, r: 10, collected: false },
    { x: 980, y: 230, r: 10, collected: false },
    { x: 1020, y: 230, r: 10, collected: false },
    { x: 1270, y: 160, r: 10, collected: false },
    { x: 1800, y: 240, r: 10, collected: false },
    { x: 1840, y: 240, r: 10, collected: false }
  ];

  enemies = [
    { x: 500, y: 368, w: 32, h: 32, vx: -1.1, minX: 480, maxX: 680, alive: true },
    { x: 1000, y: 368, w: 32, h: 32, vx: -1.3, minX: 820, maxX: 1100, alive: true },
    { x: 1700, y: 368, w: 32, h: 32, vx: -1.3, minX: 1600, maxX: 1950, alive: true }
  ];
}

function updateHUD() {
  scoreEl.textContent = score;
  coinsEl.textContent = coinCount;
}

function checkCollision(a, b) {
  return a.x < b.x + b.w && a.x + a.width > b.x &&
         a.y < b.y + b.h && a.y + a.height > b.y;
}

function update() {
  if (gameOver || gameWon) return;

  if (keys.right) player.vx = player.speed;
  else if (keys.left) player.vx = -player.speed;
  else player.vx *= FRICTION;

  if (keys.up && player.grounded) {
    player.vy = player.jumpPower;
    player.grounded = false;
  }

  player.vy += GRAVITY;
  player.x += player.vx;
  if (player.x < 0) player.x = 0;

  platforms.forEach(p => {
    if (checkCollision(player, p)) {
      if (player.vx > 0) player.x = p.x - player.width;
      else if (player.vx < 0) player.x = p.x + p.w;
    }
  });

  player.y += player.vy;
  player.grounded = false;

  platforms.forEach(p => {
    if (checkCollision(player, p)) {
      if (player.vy > 0) {
        player.y = p.y - player.height;
        player.vy = 0;
        player.grounded = true;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  });

  if (player.y > canvas.height) gameOver = true;

  coins.forEach(c => {
    if (!c.collected) {
      let box = { x: c.x - c.r, y: c.y - c.r, w: c.r * 2, h: c.r * 2 };
      if (checkCollision(player, box)) {
        c.collected = true;
        coinCount++;
        score += 100;
        updateHUD();
      }
    }
  });

  enemies.forEach(e => {
    if (!e.alive) return;
    e.x += e.vx;
    if (e.x <= e.minX || e.x + e.w >= e.maxX) e.vx *= -1;

    if (checkCollision(player, e)) {
      if (player.vy > 0 && player.y + player.height - player.vy <= e.y + 12) {
        e.alive = false;
        player.vy = -7.5;
        score += 200;
        updateHUD();
      } else {
        gameOver = true;
      }
    }
  });

  if (checkCollision(player, { x: flag.x, y: flag.y, w: flag.width, h: flag.height })) {
    gameWon = true;
    score += 1000;
    updateHUD();
  }

  if (player.x > canvas.width * 0.4) {
    cameraX = player.x - canvas.width * 0.4;
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(-cameraX, 0);

  ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
  [150, 550, 1050, 1600, 2100].forEach(cx => {
    ctx.beginPath();
    ctx.arc(cx, 80, 25, 0, Math.PI * 2);
    ctx.arc(cx + 25, 75, 30, 0, Math.PI * 2);
    ctx.arc(cx + 50, 80, 25, 0, Math.PI * 2);
    ctx.fill();
  });

  platforms.forEach(p => {
    if (p.type === 'ground') {
      ctx.fillStyle = '#c84c0c';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#00a800';
      ctx.fillRect(p.x, p.y, p.w, 10);
    } else if (p.type === 'brick') {
      ctx.fillStyle = '#b84818';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.strokeStyle = '#000';
      ctx.strokeRect(p.x, p.y, p.w, p.h);
    } else if (p.type === 'pipe') {
      ctx.fillStyle = '#00a800';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.strokeStyle = '#004400';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x, p.y, p.w, p.h);
    }
  });

  coins.forEach(c => {
    if (!c.collected) {
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#b8860b';
      ctx.stroke();
    }
  });

  enemies.forEach(e => {
    if (e.alive) {
      ctx.fillStyle = '#8b4513';
      ctx.fillRect(e.x, e.y, e.w, e.h);
      ctx.fillStyle = '#fff';
      ctx.fillRect(e.x + 6, e.y + 8, 6, 6);
      ctx.fillRect(e.x + 20, e.y + 8, 6, 6);
    }
  });

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(flag.x, flag.y, 6, flag.height);
  ctx.fillStyle = '#e52521';
  ctx.beginPath();
  ctx.moveTo(flag.x + 6, flag.y);
  ctx.lineTo(flag.x + 65, flag.y + 25);
  ctx.lineTo(flag.x + 6, flag.y + 50);
  ctx.fill();

  ctx.fillStyle = '#e52521';
  ctx.fillRect(player.x, player.y, player.width, player.height);
  ctx.fillStyle = '#0058f8';
  ctx.fillRect(player.x + 4, player.y + 20, player.width - 8, 22);
  ctx.fillStyle = '#ffcc99';
  ctx.fillRect(player.x + 8, player.y + 6, 18, 12);

  ctx.restore();

  if (gameOver || gameWon) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(gameWon ? 'TEBRİKLER, BÖLÜMÜ GEÇTİN!' : 'OYUN BİTTİ!', canvas.width / 2, canvas.height / 2 - 20);
    ctx.font = '20px sans-serif';
    ctx.fillText('Tekrar oynamak için ekrana dokun veya R tuşuna bas', canvas.width / 2, canvas.height / 2 + 25);
  }
}

// 144Hz / 240Hz Bağımsız Sabit Zaman Adımlı (Fixed Timestep) Motor
const FIXED_STEP = 1000 / 60;
let lastTime = performance.now();
let accumulator = 0;

function loop(now) {
  let frameTime = now - lastTime;
  if (frameTime > 100) frameTime = 100;
  lastTime = now;
  accumulator += frameTime;

  while (accumulator >= FIXED_STEP) {
    update();
    accumulator -= FIXED_STEP;
  }

  draw();
  requestAnimationFrame(loop);
}

window.addEventListener('keydown', e => {
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') keys.up = true;
  if (e.code === 'KeyR' && (gameOver || gameWon)) initLevel();
});

window.addEventListener('keyup', e => {
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') keys.up = false;
});

const bindTouch = (id, key) => {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; }, { passive: false });
  btn.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; }, { passive: false });
  btn.addEventListener('touchcancel', e => { e.preventDefault(); keys[key] = false; }, { passive: false });
};
bindTouch('btn-left', 'left');
bindTouch('btn-right', 'right');
bindTouch('btn-jump', 'up');

canvas.addEventListener('click', () => {
  if (gameOver || gameWon) initLevel();
});

initLevel();
requestAnimationFrame(loop);
</script>
</body>
</html>
