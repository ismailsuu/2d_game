      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;

    .game-title {
      font-size: clamp(32px, 6.5vw, 56px);
      font-weight: 900;
      color: #fbd000;
      text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      margin-bottom: 36px;
      letter-spacing: 3px;
    }
    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 290px;
    }
    .menu-btn {
      padding: 14px 18px;
      font-size: 18px;
      font-weight: 900;
      font-family: 'Courier New', Courier, monospace;
      border: 4px solid #000;
      border-radius: 0;
      color: #fff;
      cursor: pointer;
      box-shadow: inset -4px -4px 0 rgba(0,0,0,0.35), inset 4px 4px 0 rgba(255,255,255,0.35), 4px 4px 0 #000;

    }

      box-shadow: inset 2px 2px 0 rgba(0,0,0,0.4), 1px 1px 0 #000;
    }
    #btn-continue {

      display: none;
    }
    #btn-new-game {

    }

    #game-stage {

      position: fixed;
      inset: 0;
      background: #0b0f19;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      border: 3px solid #000;
      box-shadow: 0 0 0 2px #334155;
      transition: all 0.2s ease;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      text-shadow: 2px 2px 0 #000;

      pointer-events: none;

      color: #fff;

      font-size: 13px;
      font-weight: bold;

      pointer-events: none;

      pointer-events: auto;

      background: rgba(255, 255, 255, 0.14);
      border: 3px solid rgba(255, 255, 255, 0.4);

      font-size: 30px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      pointer-events: auto;

    .ctrl-btn:active {
      background: rgba(255, 255, 255, 0.35);
      border-color: #fff;
      transform: scale(0.95);
    }

        padding-bottom: max(28px, env(safe-area-inset-bottom));

        width: auto;

function drawSprite(spriteObj, x, y, w, h, flipX = false) {
  const { palette, grid } = spriteObj;
  const rows = grid.length;
  const cols = grid[0].length;
  const pw = w / cols;
  const ph = h / rows;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const ch = grid[r][c];
      if (ch === '.') continue;
      ctx.fillStyle = palette[ch];
      const drawCol = flipX ? (cols - 1 - c) : c;
      ctx.fillRect(
        Math.floor(x + drawCol * pw),
        Math.floor(y + r * ph),
        Math.ceil(pw),
        Math.ceil(ph)
      );
    }
  }
}

function getSavedProgress() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function saveProgress(lvl, sc, cn) {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ level: lvl, score: sc, coins: cn }));
  } catch (e) {}
}

function clearProgress() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}

function refreshMenu() {
  const saved = getSavedProgress();
  if (saved && saved.level > 1 && saved.level <= MAX_LEVELS) {
    btnContinue.style.display = 'block';
    btnContinue.textContent = `DEVAM ET (BÖLÜM ${saved.level})`;
  } else {
    btnContinue.style.display = 'none';
  }
}

  isGameRunning = true;

  gameStage.style.display = 'flex';
  score = startScore;
  coinCount = startCoins;
  allCompleted = false;
  loadLevel(startLevel);
}

function returnToMenu() {
  isGameRunning = false;
  keys.left = false;
  keys.right = false;
  gameStage.style.display = 'none';
  mainMenu.style.display = 'flex';
  refreshMenu();
}

});

      { type: 'spiky', x: 1850, y: 368, w: 36, h: 32, vx: -1.8, minX: 1550, maxX: 2100 },
      { type: 'jumper', x: 2000, y: 368, w: 32, h: 32, vx: -1.6, vy: 0, minX: 1600, maxX: 2120 },
      { type: 'flyer', x: 2450, y: 220, baseY: 220, w: 36, h: 26, vx: -1.9, minX: 2280, maxX: 2650, phase: 2 }
    ]
  }
];

let platforms = [];
let coins = [];
let enemies = [];
let flag = { x: 2250, y: 150, width: 15, height: 250 };
let currentTheme = LEVELS[0];

function loadLevel(lvlNum) {
  currentLevel = lvlNum;
  currentTheme = LEVELS[lvlNum - 1];
  player.x = 60; player.y = 200; player.vx = 0; player.vy = 0;
  player.grounded = false; player.jumpCount = 0; player.facing = 1;
  cameraX = 0;
  gameOver = false;
  levelCleared = false;
  jumpEffects = [];

  platforms = currentTheme.platforms.map(p => ({ ...p }));
  coins = currentTheme.coins.map(c => ({ x: c.x, y: c.y, r: 11, collected: false }));
  enemies = currentTheme.enemies.map(e => ({ ...e, alive: true }));
  flag.x = currentTheme.flagX;

  updateHUD();
}

function updateHUD() {
  levelEl.textContent = `${currentLevel}/${MAX_LEVELS}`;
  scoreEl.textContent = score;
  coinsEl.textContent = coinCount;
}

function triggerJump() {
  if (!isGameRunning || gameOver || levelCleared || allCompleted) return;
  if (player.grounded || player.jumpCount < player.maxJumps) {
    player.vy = player.jumpPower;
    player.grounded = false;
    player.jumpCount++;
    if (player.jumpCount === 2) {
      jumpEffects.push({ x: player.x + player.width / 2, y: player.y + player.height, size: 12, alpha: 1 });
    }
  }
}

function checkCollision(a, b) {
  return a.x < b.x + b.w && a.x + a.width > b.x &&
         a.y < b.y + b.h && a.y + a.height > b.y;
}

function update(dt) {
  if (!isGameRunning || gameOver || levelCleared || allCompleted) return;

  animTick += dt;

  if (keys.right) {
    player.vx = player.speed;
    player.facing = 1;
  } else if (keys.left) {
    player.vx = -player.speed;
    player.facing = -1;
  } else {
    player.vx *= Math.pow(FRICTION, dt);
  }

  player.vy += GRAVITY * dt;
  player.x += player.vx * dt;
  if (player.x < 0) player.x = 0;

  platforms.forEach(p => {
    if (checkCollision(player, p)) {
      if (player.vx > 0) player.x = p.x - player.width;
      else if (player.vx < 0) player.x = p.x + p.w;
    }
  });

  const prevBottom = player.y + player.height;
  player.y += player.vy * dt;
  player.grounded = false;

  platforms.forEach(p => {
    if (checkCollision(player, p)) {
      if (player.vy > 0) {
        player.y = p.y - player.height;
        player.vy = 0;
        player.grounded = true;
        player.jumpCount = 0;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  });

  jumpEffects.forEach(ef => { ef.size += 1.6 * dt; ef.alpha -= 0.06 * dt; });
  jumpEffects = jumpEffects.filter(ef => ef.alpha > 0);

  if (player.y > canvas.height) gameOver = true;

  coins.forEach(c => {
    if (!c.collected) {
      let box = { x: c.x - c.r, y: c.y - c.r, w: c.r * 2, h: c.r * 2 };
      if (checkCollision(player, box)) {
        c.collected = true;
        coinCount++;
        score += 100;
        updateHUD();
      }
    }
  });

  enemies.forEach(e => {
    if (!e.alive) return;

    if (e.type === 'goomba' || e.type === 'spiky') {
      e.x += e.vx * dt;
      if (e.x <= e.minX || e.x + e.w >= e.maxX) e.vx *= -1;
    } else if (e.type === 'jumper') {
      e.x += e.vx * dt;
      if (e.x <= e.minX || e.x + e.w >= e.maxX) e.vx *= -1;
      e.vy += 0.4 * dt;
      e.y += e.vy * dt;
      if (e.y >= 368) {
        e.y = 368;
        e.vy = -8.5;
      }
    } else if (e.type === 'flyer') {
      e.x += e.vx * dt;
      if (e.x <= e.minX || e.x + e.w >= e.maxX) e.vx *= -1;
      e.phase += 0.06 * dt;
      e.y = e.baseY + Math.sin(e.phase) * 35;
    }

    if (checkCollision(player, e)) {
      if (e.type === 'spiky') {
        gameOver = true;
      } else if (player.vy > 0 && prevBottom <= e.y + 16) {
        e.alive = false;
        player.vy = -8;
        player.jumpCount = 1;
        score += 250;
        updateHUD();
      } else {
        gameOver = true;
      }
    }
  });

  if (checkCollision(player, { x: flag.x, y: flag.y, w: flag.width, h: flag.height })) {
    score += 1000;
    updateHUD();
    if (currentLevel < MAX_LEVELS) {
      levelCleared = true;
      saveProgress(currentLevel + 1, score, coinCount);
    } else {
      allCompleted = true;
      clearProgress();
    }
  }

  if (player.x > canvas.width * 0.4) {
    cameraX = player.x - canvas.width * 0.4;
  }
}

// RETRO PİKSEL ÇİZİM FONKSİYONLARI
function drawPixelCloud(cx, cy) {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(cx + 12, cy, 40, 12);
  ctx.fillRect(cx + 4, cy + 12, 56, 12);
  ctx.fillRect(cx, cy + 24, 64, 10);
  ctx.fillStyle = '#cbd5e1';
  ctx.fillRect(cx, cy + 32, 64, 4);
}

function draw() {
  if (!isGameRunning) return;

  ctx.fillStyle = currentTheme.sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(-Math.floor(cameraX), 0);

  // Retro Piksel Bulutlar
  [140, 580, 1080, 1620, 2180, 2720].forEach(cx => {
    drawPixelCloud(cx, 65);
  });

  // Retro Piksel Platformlar
  platforms.forEach(p => {
    if (p.type === 'ground') {
      ctx.fillStyle = currentTheme.groundBody;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      // Toprak içi piksel benekleri
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      for (let gx = p.x + 8; gx < p.x + p.w - 8; gx += 24) {
        ctx.fillRect(gx, p.y + 18, 8, 8);
        ctx.fillRect(gx + 10, p.y + 32, 8, 8);
      }
      // Üst çimen katmanı
      ctx.fillStyle = currentTheme.groundTop;
      ctx.fillRect(p.x, p.y, p.w, 12);
      ctx.fillStyle = '#000';
      ctx.fillRect(p.x, p.y + 12, p.w, 2);
    } else if (p.type === 'brick') {
      ctx.fillStyle = '#c84c0c';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      // Tuğla derz çizgileri ve parlaklık
      ctx.fillStyle = '#fca044';
      ctx.fillRect(p.x, p.y, p.w, 3);
      ctx.fillStyle = '#000';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x, p.y, p.w, p.h);
      ctx.fillRect(p.x, p.y + 12, p.w, 2);
      for (let bx = p.x + 25; bx < p.x + p.w; bx += 25) {
        ctx.fillRect(bx, p.y, 2, 12);
        ctx.fillRect(bx - 12, p.y + 12, 2, 13);
      }
    } else if (p.type === 'pipe') {
      // Boru gövdesi + retro ışık şeridi
      ctx.fillStyle = '#00a800';
      ctx.fillRect(p.x + 4, p.y + 14, p.w - 8, p.h - 14);
      ctx.fillStyle = '#80d010';
      ctx.fillRect(p.x + 8, p.y + 14, 6, p.h - 14);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x + 4, p.y + 14, p.w - 8, p.h - 14);
      // Boru üst ağzı
      ctx.fillStyle = '#00a800';
      ctx.fillRect(p.x, p.y, p.w, 14);
      ctx.fillStyle = '#80d010';
      ctx.fillRect(p.x + 5, p.y + 2, 8, 10);
      ctx.strokeRect(p.x, p.y, p.w, 14);
    }
  });

  // Piksel Altınlar
  coins.forEach(c => {
    if (!c.collected) {
      const bob = Math.sin(animTick * 0.1 + c.x) * 2;
      drawSprite(SPRITES.coin, c.x - 10, c.y - 10 + bob, 20, 20);
    }
  });

  // Piksel Düşmanlar
  enemies.forEach(e => {
    if (!e.alive) return;
    const flip = e.vx > 0;
    if (e.type === 'goomba') {
      drawSprite(SPRITES.goomba, e.x, e.y, e.w, e.h, Math.floor(animTick / 10) % 2 === 0);
    } else if (e.type === 'jumper') {
      drawSprite(SPRITES.jumper, e.x, e.y, e.w, e.h, flip);
    } else if (e.type === 'flyer') {
      drawSprite(SPRITES.flyer, e.x, e.y, e.w, e.h, flip);
    } else if (e.type === 'spiky') {
      drawSprite(SPRITES.spiky, e.x, e.y, e.w, e.h, flip);
    }
  });

  // Çift Zıplama Piksel Duman Kareleri
  jumpEffects.forEach(ef => {
    ctx.fillStyle = `rgba(255, 255, 255, ${ef.alpha})`;
    ctx.fillRect(ef.x - ef.size, ef.y - 4, 8, 8);
    ctx.fillRect(ef.x + ef.size - 8, ef.y - 4, 8, 8);
    ctx.fillRect(ef.x - 4, ef.y + 2, 8, 6);
  });

  // Retro Bitiş Direği ve Bayrağı
  ctx.fillStyle = '#000';
  ctx.fillRect(flag.x - 1, flag.y - 1, 8, flag.height + 2);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(flag.x, flag.y, 6, flag.height);
  ctx.fillStyle = '#fbd000';
  ctx.fillRect(flag.x - 3, flag.y - 8, 12, 10);
  ctx.fillStyle = '#e52521';
  ctx.fillRect(flag.x + 6, flag.y + 4, 48, 32);
  ctx.strokeStyle = '#000';
  ctx.strokeRect(flag.x + 6, flag.y + 4, 48, 32);

  // Piksel Oyuncu (Durma / Yürüme Animasyonu + Yön Çevirme)
  const isMoving = Math.abs(player.vx) > 0.4 && player.grounded;
  const activePlayerSprite = (isMoving && Math.floor(animTick / 6) % 2 === 1)
    ? SPRITES.playerWalk
    : SPRITES.playerIdle;
  drawSprite(activePlayerSprite, player.x, player.y, player.width, player.height, player.facing === -1);

  ctx.restore();

  // Retro Durum Ekranları
  if (gameOver || levelCleared || allCompleted) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fbd000';
    ctx.textAlign = 'center';

    if (allCompleted) {
      ctx.font = 'bold 30px "Courier New", monospace';
      ctx.fillText('TUM 5 BOLUM TAMAMLANDI!', canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillText(`SKOR: ${score} - ANA MENU ICIN DOKUN`, canvas.width / 2, canvas.height / 2 + 25);
    } else if (levelCleared) {
      ctx.font = 'bold 30px "Courier New", monospace';
      ctx.fillText(`BOLUM ${currentLevel} GECILDI!`, canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillText(`BOLUM ${currentLevel + 1} ICIN EKRANA DOKUN`, canvas.width / 2, canvas.height / 2 + 25);
    } else {
      ctx.fillStyle = '#e52521';
      ctx.font = 'bold 34px "Courier New", monospace';
      ctx.fillText('OYUN BITTI!', canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillText('TEKRAR DENEMEK ICIN DOKUN', canvas.width / 2, canvas.height / 2 + 25);
    }
  }
}

let lastTime = performance.now();

function loop(now) {
  let rawDt = (now - lastTime) / (1000 / 60);
  lastTime = now;
  if (rawDt > 2.5) rawDt = 2.5;

  update(rawDt);
  draw();
  requestAnimationFrame(loop);
}

function handleScreenAction() {
  if (!isGameRunning) return;
  if (allCompleted) returnToMenu();
  else if (levelCleared) loadLevel(currentLevel + 1);
  else if (gameOver) loadLevel(currentLevel);
}

window.addEventListener('keydown', e => {
  if (!isGameRunning) return;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if ((e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') && !e.repeat) {
    if (gameOver || levelCleared || allCompleted) handleScreenAction();
    else triggerJump();
  }
  if (e.code === 'KeyR' && gameOver) loadLevel(currentLevel);
});

window.addEventListener('keyup', e => {
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
});

const bindMove = (id, key) => {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; }, { passive: false });
  btn.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; }, { passive: false });
  btn.addEventListener('touchcancel', e => { e.preventDefault(); keys[key] = false; }, { passive: false });
};
bindMove('btn-left', 'left');
bindMove('btn-right', 'right');

const jumpBtn = document.getElementById('btn-jump');
jumpBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  if (gameOver || levelCleared || allCompleted) handleScreenAction();
  else triggerJump();
}, { passive: false });

canvas.addEventListener('click', handleScreenAction);

refreshMenu();
requestAnimationFrame(loop);
</script>
